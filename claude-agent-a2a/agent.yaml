agent:
  name: "Claude Agent"
  description: "AI assistant powered by Claude Agent SDK, accessible via A2A protocol"
  version: "1.0.0"
  organization: "tehsmash"

bindings:
  jsonrpc:
    enabled: true
    host: "0.0.0.0"
    port: 45000

  slimrpc:
    enabled: true
    # Set use_slim_config: true to load connection details (node address, app
    # name, auth) from slim.yaml discovered via hierarchical walk-up from the
    # current directory. The url/namespace/group/name/secret fields below are
    # ignored when use_slim_config is true.
    use_slim_config: true
    #url: "http://localhost:46357"
    #namespace: "agntcy"
    #group: "default"
    #name: "claude-agent"
    #secret: "areallyreallyreallyreallylongsecret"
