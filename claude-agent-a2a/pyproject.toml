[project]
name = "a2a-claude-agent-sdk"
version = "0.1.0"
description = "A2A protocol server wrapping Claude Agent SDK sessions"
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk==1.1.0",
    "fastapi>=0.100.0",
    "claude-agent-sdk>=0.1.0",
    "slima2a>=0.6.0",
    "uvicorn>=0.30.0",
    "pyyaml>=6.0",
]

[tool.uv]
override-dependencies = [
    "a2a-sdk==1.1.0",
    "slim-bindings==2.0.0a2",
]

[tool.uv.sources]
slima2a = { git = "https://github.com/agntcy/slim-a2a-python.git", branch = "main" }
slim-bindings = { git = "https://github.com/agntcy/slim-bindings.git", branch = "feat/hierarchical-slim-config-loading", subdirectory = "python" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
a2a-claude-agent = "a2a_claude_agent_sdk.server:main"
