[project]
name = "network-of-assistants"
version = "0.1.0"
description = "NoA app"
readme = "README.md"
requires-python = ">=3.13"

[tool.uv.workspace]
members = ["noa-file-assistant", "noa-slim", "noa-user-proxy", "noa-moderator", "noa-web-surfer", "noa-math-assistant"]

[dependency-groups]
dev = ["ruff<1.0.0,>=0.9.3"]

[tool.uv]
exclude-newer = "7 days"
constraint-dependencies = [
    "aiohttp>=3.14.4",
    "certifi>=2026.10.18",
    "filelock>=4.2.1",
    "nltk>=3.10.4",
    "opentelemetry-api>=1.45.2",
    "pillow>=13.0.0",
    "pyjwt>=2.15.0",
    "urllib3>=2.8.0",
]
